# Generate and deploy the json-lib Doxygen reference site.
#
# The workflow runs only for documentation-relevant changes on main or by manual
# dispatch. It builds static HTML from the checked-in Doxyfile, rejects Doxygen
# warnings, uploads the generated site as a Pages artifact, and deploys it through
# GitHub Pages' supported workflow mechanism.
name: Publish Doxygen documentation

on:
  push:
    branches:
      - main
    paths:
      - Doxyfile
      - README.md
      - include/**
      - src/**
      - docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

# Only one Pages deployment may run at a time. Do not cancel an active deployment
# after artifact upload, because an incomplete publication is worse than a queued
# documentation update.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Generate Doxygen HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact documentation source
        uses: actions/checkout@v6

      # The repository may not yet have a Pages site. Explicit enablement creates
      # it with GitHub Actions as the deployment source on the first successful run.
      - name: Configure and enable GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Doxygen
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Generate API reference
        run: |
          set -euo pipefail
          rm -rf docs/generated
          doxygen Doxyfile
          test -f docs/generated/html/index.html
          if test -s docs/generated/doxygen-warnings.log; then
            echo "Doxygen warnings are quality-gate failures:"
            cat docs/generated/doxygen-warnings.log
            exit 1
          fi

      - name: Upload generated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/generated/html

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
